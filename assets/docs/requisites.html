<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реквизиты организации</title>
    <style>
        body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 760px; margin: 0 auto; padding: 32px 24px; color: #2D3E40; line-height: 1.7; background: #F7F5F2; }
        h1 { font-size: 26px; color: #1F3A3D; margin-bottom: 20px; }
        h2 { font-size: 18px; color: #1F3A3D; margin-top: 28px; }
        p, li { font-size: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; background: #fff; border-radius: 12px; overflow: hidden; }
        td { padding: 14px 16px; border-bottom: 1px solid #E3DED7; font-size: 15px; }
        td:first-child { font-weight: 600; width: 40%; color: #1F3A3D; }
        .note { background: #fff; border: 1px solid #E3DED7; border-radius: 12px; padding: 16px; font-size: 14px; color: #5C6B6E; }
    </style>
</head>
<body>
    <h1>Реквизиты организации</h1>
    <p class="note">Поля заполняются заказчицей после консультации с юристом. Сейчас — плейсхолдеры.</p>
    <table>
        <tr><td>Наименование</td><td>ИП / ООО «…»</td></tr>
        <tr><td>ИНН</td><td>—</td></tr>
        <tr><td>ОГРН / ОГРНИП</td><td>—</td></tr>
        <tr><td>Юридический адрес</td><td>—</td></tr>
        <tr><td>Контактный e-mail</td><td>hello@example.com</td></tr>
        <tr><td>Телефон</td><td>—</td></tr>
    </table>
</body>
</html>
